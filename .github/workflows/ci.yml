name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run Tests
        run: go test -v ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/oss-ask-linux-amd64 ./cmd/oss-ask
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/oss-ask-linux-arm64 ./cmd/oss-ask
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/oss-ask-darwin-amd64 ./cmd/oss-ask
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/oss-ask-darwin-arm64 ./cmd/oss-ask
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/oss-ask-windows-amd64.exe ./cmd/oss-ask

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
